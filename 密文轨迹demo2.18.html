<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密文轨迹 demo 2.18</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0e17;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            color: #e0e8f0;
        }
        .wrapper {
            background: #131b26;
            border-radius: 28px;
            padding: 20px 24px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a3a50;
            max-width: 1100px;
            width: 100%;
        }
        .game-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .canvas-wrap {
            position: relative;
            background: #0c121c;
            border-radius: 18px;
            border: 1px solid #253544;
            padding: 4px;
            pointer-events: none;
            flex: 1;
            min-width: 400px;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 780 / 560;
            border-radius: 14px;
            cursor: crosshair;
            background: #0a111b;
            pointer-events: none;
        }
        .panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
            flex-shrink: 0;
        }
        .panel-box {
            background: #18212c;
            border-radius: 16px;
            padding: 10px 12px;
            border: 1px solid #2a3d52;
            pointer-events: auto;
        }
        .panel-box h4 {
            font-size: 10px;
            font-weight: 400;
            color: #8aa3c0;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 1px 0;
            border-bottom: 1px solid #1f2e3d;
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .stat-val {
            color: #b8d0ea;
            font-weight: 600;
        }
        .stat-val.score {
            color: #f5c542;
            font-size: 15px;
        }
        .stat-val.danger {
            color: #f58b8b;
        }

        .hand-row {
            display: flex;
            gap: 4px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .hand-card {
            background: #1e2d3e;
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 10px;
            border: 1px solid #3a5575;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 1;
            min-width: 40px;
            justify-content: center;
            pointer-events: auto;
        }
        .hand-card:hover {
            background: #2a3f58;
            border-color: #5d82aa;
            transform: translateY(-1px);
        }
        .hand-card .tag {
            font-size: 7px;
            background: #2a4058;
            padding: 0 4px;
            border-radius: 20px;
            color: #9bb6d4;
        }
        .hand-card.trigger-card {
            border-left: 3px solid #4a9eff;
        }
        .hand-card.effect-card {
            border-left: 3px solid #ffb347;
        }

        .slot-group {
            display: flex;
            gap: 6px;
            margin: 3px 0 6px;
        }
        .slot {
            flex: 1;
            background: #0f1823;
            border-radius: 8px;
            padding: 6px 3px;
            border: 1px dashed #3a5575;
            text-align: center;
            font-size: 10px;
            min-height: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
        }
        .slot.filled {
            border-color: #6a9fd8;
            background: #1a2a3d;
        }
        .slot .sub {
            font-size: 7px;
            opacity: 0.5;
        }
        .btn-combine {
            width: 100%;
            padding: 6px 0;
            background: #2a4a6a;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            color: #eaf2ff;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 2px 0 #0f1c2b;
            pointer-events: auto;
        }
        .btn-combine:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #0f1c2b;
        }
        .btn-combine:disabled {
            opacity: 0.3;
            transform: translateY(2px);
            box-shadow: 0 0 0 #0f1c2b;
            pointer-events: none;
        }
        .feedback {
            background: #0d1823;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 11px;
            min-height: 32px;
            border-left: 3px solid #4a7a9f;
            color: #c2d6ed;
            pointer-events: none;
        }
        .feedback .tag {
            display: inline-block;
            background: #1e3349;
            border-radius: 30px;
            padding: 0 8px;
            font-size: 8px;
            margin-right: 4px;
            color: #b0cef0;
        }

        .lib-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 3px;
        }
        .lib-card {
            background: #1a2635;
            padding: 2px 8px 2px 6px;
            border-radius: 20px;
            font-size: 9px;
            border: 1px solid #314a63;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            pointer-events: auto;
        }
        .lib-card:hover {
            background: #253a52;
            border-color: #5a7fa5;
        }
        .lib-card.lib-trigger {
            border-left: 3px solid #4a9eff;
        }
        .lib-card.lib-effect {
            border-left: 3px solid #ffb347;
        }
        .lib-card .badge {
            font-size: 6px;
            background: #2a4058;
            padding: 0 4px;
            border-radius: 20px;
            color: #8aaecf;
        }
        .lib-card .count-badge {
            font-size: 7px;
            background: #1a2a3a;
            padding: 0 4px;
            border-radius: 20px;
            color: #6a8aaa;
        }

        .passive-list {
            max-height: 50px;
            overflow-y: auto;
            font-size: 10px;
            color: #b8d0ea;
        }
        .passive-list .item {
            padding: 1px 0;
            border-bottom: 1px solid #1a2a3a;
            display: flex;
            justify-content: space-between;
        }
        .passive-list .item .count {
            color: #ffb347;
            font-weight: 600;
        }

        .controls-hint {
            font-size: 9px;
            color: #6a85a3;
            text-align: center;
            padding: 2px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .controls-hint kbd {
            background: #1a2736;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid #3a5575;
            font-size: 9px;
            color: #c0d6ee;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid #3a5575;
            color: #8aa3c0;
            padding: 1px 12px;
            border-radius: 30px;
            font-size: 9px;
            cursor: pointer;
            pointer-events: auto;
        }
        .btn-reset:hover {
            background: #1f3145;
            border-color: #6a8db0;
        }
        .hand-count {
            font-size: 9px;
            color: #6a8aaa;
            margin-left: 4px;
        }
        .wave-display {
            font-size: 18px;
            font-weight: 700;
            color: #f5c542;
            text-align: center;
        }

        .passive-box {
            max-height: 60px;
            overflow-y: auto;
        }
        .passive-box::-webkit-scrollbar {
            width: 2px;
        }
        .passive-box::-webkit-scrollbar-thumb {
            background: #2a4058;
            border-radius: 10px;
        }

        /* 三选一 + 真空期 */
        .selection-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }
        .selection-overlay.active { display: flex; }
        .selection-overlay h3 {
            color: #f5c542;
            font-size: 20px;
            margin-bottom: 4px;
        }
        .selection-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .selection-card {
            background: #1a2635;
            border-radius: 16px;
            padding: 20px 28px;
            border: 2px solid #3a5575;
            cursor: pointer;
            text-align: center;
            transition: 0.15s;
            min-width: 140px;
            pointer-events: auto;
        }
        .selection-card:hover {
            background: #253a52;
            border-color: #f5c542;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(245,197,66,0.3);
        }
        .selection-card .s-emoji { font-size: 36px; display: block; margin-bottom: 6px; }
        .selection-card .s-label { font-size: 16px; color: #e0e8f0; font-weight: 600; }
        .selection-card .s-type { font-size: 10px; color: #8aa3c0; margin-top: 4px; }
        .selection-card.sel-trigger { border-left: 4px solid #4a9eff; }
        .selection-card.sel-effect { border-left: 4px solid #ffb347; }

        .vacuum-bar-wrap {
            display: none;
            background: #18212c;
            border-radius: 12px;
            padding: 8px 14px;
            border: 1px solid #2a3d52;
            align-items: center;
            gap: 10px;
        }
        .vacuum-bar-wrap.active { display: flex; }
        .vacuum-bar-fill {
            flex: 1;
            height: 8px;
            background: #1a2a3a;
            border-radius: 10px;
            overflow: hidden;
        }
        .vacuum-bar-fill-inner {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #5ac8fa);
            border-radius: 10px;
            transition: width 0.3s;
        }
        .vacuum-label {
            font-size: 11px;
            color: #b0cef0;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }
        .btn-skip {
            background: #2a4a6a;
            border: none;
            color: #eaf2ff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 600;
            pointer-events: auto;
        }
        .btn-skip:hover { background: #3a5f8a; }

        @media (max-width: 1100px) {
            .game-row {
                flex-direction: column;
                align-items: center;
            }
            .panel {
                width: 100%;
                max-width: 780px;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .panel-box {
                flex: 1;
                min-width: 150px;
            }
            .canvas-wrap {
                min-width: unset;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="game-row">
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="780" height="560"></canvas>
        </div>

        <div class="panel" id="panelRoot">
            <div class="panel-box">
                <h4>📊 密文轨迹 demo 2.18 · 新手教程 + 性能修复</h4>
                <div class="stat-row"><span>🏰 核心</span><span class="stat-val" id="coreDisplay">100%</span></div>
                <div class="stat-row"><span>🌊 波次</span><span class="stat-val wave-display" id="waveDisplay">1</span></div>
                <div class="stat-row"><span>⭐ 得分</span><span class="stat-val score" id="scoreDisplay">0</span></div>
                <div class="stat-row"><span>🛡️ 护盾</span><span class="stat-val" id="hpDisplay">100</span></div>
                <div class="stat-row"><span>⚔️ 攻击</span><span class="stat-val" id="atkDisplay">10</span></div>
                <div class="stat-row"><span>💥 倍率</span><span class="stat-val" id="multDisplay">x1.0</span></div>
                <div class="stat-row"><span>🐾 怪物</span><span class="stat-val" id="monsterCount">0</span></div>
                <div class="stat-row"><span>💀 击杀</span><span class="stat-val" id="killDisplay">0</span></div>
                <div class="stat-row" style="border-bottom:none;margin-top:2px;font-size:10px;color:#6a8aaa;">
                    <span>📈 难度系数</span>
                    <span class="stat-val" id="diffDisplay" style="color:#ff8844;">1.00x</span>
                </div>
            </div>

            <div class="panel-box">
                <h4>🃏 手牌 <span style="font-weight:400;font-size:9px;color:#6a85a3;">左键填入 · 满20替旧</span>
                    <span class="hand-count" id="handCountDisplay">触发:0 效果:0</span>
                </h4>
                <div class="hand-row" id="handContainer"></div>

                <div class="slot-group">
                    <div class="slot" id="triggerSlot">⬅ 触发<br><span class="sub">点击选择</span></div>
                    <div class="slot" id="effectSlot">效果 ➡<br><span class="sub">点击选择</span></div>
                </div>
                <button class="btn-combine" id="combineBtn">🔮 宣读组合</button>
                <div class="feedback" id="feedbackBox"><span class="tag">✦</span> 永久被动，触发即叠加</div>
            </div>

            <div class="panel-box">
                <h4>⚡ 被动 <span style="font-weight:400;font-size:9px;color:#6a85a3;">触发即叠加</span></h4>
                <div class="passive-box" id="passiveList">
                    <div style="color:#5a7a9a;font-size:10px;">暂无被动</div>
                </div>
            </div>

            <div class="panel-box">
                <h4>📜 牌库 <span style="font-weight:400;font-size:9px;color:#6a85a3;">无限抽取</span></h4>
                <div class="lib-grid" id="libraryGrid"></div>
            </div>

            <div class="vacuum-bar-wrap" id="vacuumBar">
                <span class="vacuum-label" id="vacuumLabel">⏳ 整顿 5s</span>
                <div class="vacuum-bar-fill"><div class="vacuum-bar-fill-inner" id="vacuumFill" style="width:100%"></div></div>
                <button class="btn-skip" id="skipBtn">⏭ 跳过</button>
            </div>

            <div class="controls-hint">
                <span><kbd>W A S D</kbd> 移动</span>
                <span><kbd>空格</kbd> 组合</span>
                <span><kbd>`</kbd> 调试</span>
                <span>指数增长 · 极限挑战</span>
                <button class="btn-reset" id="resetBtn">↺ 重开</button>
            </div>
        </div>
    </div>
</div>

<div class="selection-overlay" id="selectionOverlay">
    <h3>🎴 选择一张卡牌加入手牌</h3>
    <div class="selection-row" id="selectionRow"></div>
</div>

<script>
    // ============================================================
    //  无限模式 · 指数增长 · 7种怪物 · 反噬修复 · 公式重做
    // ============================================================

    // ---------- 词条数据 ----------
    const TRIGGERS = [
        { id: 'T01', label: '对自身', emoji: '🧍' },
        { id: 'T02', label: '对敌群', emoji: '👾' },
        { id: 'T06', label: '怪触轨', emoji: '🐾' },

        { id: 'E01', label: '攻击增幅', emoji: '⚔️' },
        { id: 'E02', label: '连环击', emoji: '💥' },
        { id: 'E03', label: '生命回复', emoji: '💚' },
        { id: 'E04', label: '移速减慢', emoji: '🐢' },
        { id: 'E06', label: '轨迹升级', emoji: '⬆️' },
        { id: 'E07', label: '轨迹爆伤', emoji: '💣' },
        { id: 'E10', label: '怪物反噬', emoji: '🔄' },
        { id: 'E11', label: '自速暴涨', emoji: '💨' },
    ];

    // ---------- 怪物类型定义 ----------
    const MONSTER_TYPES = {
        BASIC: {
            id: 'basic',
            label: '普通',
            emoji: '👾',
            color: '#cc6633',
            eliteColor: '#dd5544',
            baseHp: 24,
            hpScale: 10.5,
            baseSpeed: 0.28125,

            baseAtk: 3,

        },
        HEALER: {
            id: 'healer',

            emoji: '💚',
            color: '#55dd88',
            eliteColor: '#44cc77',
            baseHp: 30,
            hpScale: 10.5,
            baseSpeed: 0.21875,

        },
        SLOW: {

        },
        SPLITTER: {

        BOSS: {

            baseAtk: 24, atkScale: 0, radius: 30, eliteRadius: 35,
            scoreValue: 3000, eliteScoreValue: 3000, weight: 0,
            isBoss: true, spawnInterval: 100, moveInterval: 60,
        },

    function getBossHp() {
        return Math.floor(50000 * Math.pow(1.6, Math.floor(G.wave / 10) - 1));
    }

    const MONSTER_TYPE_LIST = Object.values(MONSTER_TYPES);

    // ---------- 游戏状态 ----------
    const G = {
        player: { x: 390, y: 280, r: 14, hp: 100, maxHp: 100, speed: 2.8, atk: 10, mult: 1.0, shootCooldown: 0 },

        bullets: [],

        // 画布尺寸

    // ---------- DOM ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ---------- 辅助 ----------
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function angleTo(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }

    // 特效数量上限：粒子/浮字是纯表现层，必须封顶。
    // 生成速率随波数上升而寿命固定，不封顶的话每帧 draw 成本会一路涨到掉帧。
    const PARTICLE_MAX = 300;
    const FLOAT_MAX = 60;

    // ---------- 浮动数值 ----------
    function showFloatingText(x, y, text, color) {
        if (G.floatingTexts.length >= FLOAT_MAX) G.floatingTexts.shift();
        G.floatingTexts.push({
            x, y, text, color,
            life: 35,
            maxLife: 35,
            vy: -1.2 - Math.random() * 0.6,
            vx: (Math.random() - 0.5) * 0.8,
        });
    }

    // ============================================================
    //  指数增长公式
    // ============================================================
    function getDifficultyMultiplier() {
        return Math.pow(1.16, G.wave - 1);
    }

    function getMonsterCount() {
        return Math.min(4 + Math.floor(3 * Math.pow(1.10, G.wave)), 50);
    }

    function getEliteChance() {
        return Math.min(0.05 + 0.04 * Math.log2(G.wave + 1), 0.35);
    }

    function getSpawnInterval() {
        if (Tutorial.active && Tutorial.spawnInterval) return Tutorial.spawnInterval;
        return Math.max(6, 25 / Math.pow(1.06, G.wave - 1));
    }

    // ---------- 手牌平衡 ----------
    function updateHandCount() {
        G.handTriggerCount = G.hand.filter(c => c.type === 'trigger').length;
        G.handEffectCount = G.hand.filter(c => c.type === 'effect').length;
        const el = document.getElementById('handCountDisplay');
        if (el) el.textContent = `触发:${G.handTriggerCount} 效果:${G.handEffectCount}`;
    }

    // ---------- 被动系统 ----------
    function addPassive(triggerId, effectId) {
        if (!G.passives[triggerId]) G.passives[triggerId] = [];
        const existing = G.passives[triggerId].find(p => p.effectId === effectId);
        if (existing) existing.count += 1;
        else G.passives[triggerId].push({ effectId: effectId, count: 1 });
        applyPassiveEffect(triggerId, effectId, true);
        updatePassiveUI();
        addScore(10);
    }

    function triggerPassive(triggerId) {
        if (!G.passives[triggerId]) return;
        for (const p of G.passives[triggerId]) {
            for (let i = 0; i < p.count; i++) {
                applyPassiveEffect(triggerId, p.effectId, false);
            }
        }
    }

    function applyPassiveEffect(triggerId, effectId, isInitial) {
        const p = G.player;
        const isHighFreq = (triggerId === 'T06' || triggerId === 'T07' || triggerId === 'T08');
        switch (effectId) {
            case 'E01': {
                const val = isHighFreq ? 4 : 10;
                G.buffs.atkUp += val;
                if (!isInitial) spawnParticles(p.x, p.y, '#ff8844', 5);
                setFeedback(`⚔️ 攻击+${val} (累计+${G.buffs.atkUp})`, '#ff8844');
                break;
            }
            case 'E02':
                G.buffs.multUp += 0.2;
                if (!isInitial) spawnParticles(p.x, p.y, '#ffdd44', 5);
                setFeedback(`💥 倍率+0.2 (累计x${(1 + G.buffs.multUp).toFixed(1)})`, '#ffdd44');
                break;
            case 'E03': {
                const val = isHighFreq ? 4 : 15;
                p.hp = Math.min(p.maxHp, p.hp + val);
                spawnParticles(p.x, p.y, '#44ff88', 8);
                showFloatingText(p.x, p.y - p.r, '+' + val, '#44ff88');
                setFeedback(`💚 回复${val}生命`, '#44ff88');
                break;
            }
            case 'E04':
                G.buffs.slowAll = Math.min(0.5, G.buffs.slowAll + 0.05);
                if (!isInitial) setFeedback(`🐢 怪物减速+5% (累计${Math.round(G.buffs.slowAll * 100)}%)`, '#88ccff');
                break;
            case 'E06':
                G.buffs.trailDmg += 1;
                G.buffs.trailWidth += 2;
                if (!isInitial) setFeedback(`⬆️ 轨迹伤害+1，宽度+2`, '#66ddff');
                break;
            case 'E07':
                if (!isInitial) {
                    const count = explodeTrails(p.x, p.y, 200);
                    setFeedback(`💣 引爆${count}段轨迹`, '#ff6633');
                    if (count > 0) addScore(count * 2);
                }
                break;
            case 'E10':
                if (!isInitial && G.monsters.length > 0) {
                    const dmg = Math.floor(50 * (2 + getDifficultyMultiplier()) / 3);
                    G.monsters.forEach(m => {
                        m.hp = Math.max(0, m.hp - dmg);
                        spawnParticles(m.x, m.y, '#ff6644', 4);
                        showFloatingText(m.x, m.y - m.r, '-' + dmg, '#ff6644');
                    });
                    setFeedback(`🔄 怪物反噬！全场${G.monsters.length}只怪物各受${dmg}点伤害`, '#ff6644');
                }
                break;
            case 'E11':
                G.buffs.speedUp += 0.3;
                if (!isInitial) setFeedback(`💨 移速+30% (累计x${G.buffs.speedUp.toFixed(1)})`, '#88ddff');
                break;
        }
        updateUI();
    }

    // ---------- 得分系统 ----------
    function addScore(amount) {
        G.score += Math.floor(amount * G.scoreMultiplier);
        G.comboCount += 1;
        if (G.comboCount > G.maxCombo) G.maxCombo = G.comboCount;
        if (G.comboCount > 5) G.scoreMultiplier = 1 + Math.floor(G.comboCount / 10) * 0.5;
        updateUI();
    }

    // ---------- 怪物生成 ----------
    function spawnMonster() {
        const scripted = Tutorial.active ? Tutorial.nextSpawn() : null;
        const side = randInt(0, 3);
        let x, y;
        const pad = 30;
        const w = G.canvasWidth || 780;
        const h = G.canvasHeight || 560;
        if (side === 0) { x = rand(-pad, w + pad);
            y = -pad; } else if (side === 1) { x = w + pad;
            y = rand(-pad, h + pad); } else if (side === 2) { x = rand(-pad, w + pad);
            y = h + pad; } else { x = -pad;
            y = rand(-pad, h + pad); }

        const diff = getDifficultyMultiplier();
        const eliteChance = getEliteChance();
        const isElite = scripted ? !!scripted.elite : (Math.random() < eliteChance);

        let type;
        if (scripted) {
            // 教程关：类型由脚本指定
            type = MONSTER_TYPES[String(scripted.type).toUpperCase()] || MONSTER_TYPES.BASIC;
        } else {
            let typePool = MONSTER_TYPE_LIST.filter(t => !t.isBoss);
            let weights = typePool.map(t => {
                let w = t.weight;
                if (t.id === 'healer' && G.wave < 3) w *= 0.2;
                if (t.id === 'splitter' && G.wave < 2) w *= 0.2;
                if (t.id === 'tank' && G.wave > 10) w *= 1.5;
                if (t.id === 'fast' && G.wave > 8) w *= 1.3;
                if (t.id === 'healer' && G.wave > 8) w *= 1.4;
                if (t.id === 'splitter' && G.wave > 8) w *= 1.3;
                return w;
            });
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            let r = Math.random() * totalWeight;
            type = typePool[0];
            for (let i = 0; i < typePool.length; i++) {
                r -= weights[i];
                if (r <= 0) { type = typePool[i]; break; }
            }
        }

        const hpMul = Tutorial.active ? Tutorial.hpMul : 1;
        const hp = (isElite ?
            (type.baseHp + type.hpScale * 1.5) * diff :
            (type.baseHp + type.hpScale) * diff) * hpMul;
        const speed = isElite ?
            (type.baseSpeed + type.speedScale * 1.2) * Math.min(diff, 3.0) :
            (type.baseSpeed + type.speedScale) * Math.min(diff, 3.0);
        const atk = isElite ?
            (type.baseAtk + type.atkScale * 1.3) * Math.min(diff, 4.0) :
            (type.baseAtk + type.atkScale) * Math.min(diff, 4.0);

        const monster = {
            x,
            y,
            r: isElite ? type.eliteRadius : type.radius,
            hp: Math.min(hp, 5000),
            maxHp: Math.min(hp, 5000),
            speed: Math.min(speed * (1 - G.buffs.slowAll), 5.0),
            isElite,
            atk: Math.min(atk, 80),
            hitCooldown: 0,
            trailDamageCooldown: 0,
            scoreValue: isElite ? type.eliteScoreValue * diff : type.scoreValue * diff,
            type: type.id,
            typeLabel: type.label,
            typeEmoji: type.emoji,
            color: isElite ? type.eliteColor : type.color,
            isHealer: type.isHealer || false,
            healAmount: (type.healAmount || 3) * Math.min(diff, 2.5),
            isSlow: type.isSlow || false,
            slowAmount: (type.slowAmount || 0.25) + G.wave * 0.005,
            isSplitter: type.isSplitter || false,
            splitCount: type.splitCount || 2,
            canSplit: true,
            healCooldown: 0,
            isChild: false,
            moveInterval: type.moveInterval || 60,
            moveTimer: rand(0, (type.moveInterval || 60) * 2),
            isMoving: Math.random() < 0.5,
            alwaysMoving: G.wave >= 10 && Math.random() < Math.min(0.10 + 0.09 * (G.wave - 10), 1.0),
        };
        G.monsters.push(monster);
    }

    // ---------- 调试生成 ----------
    const DEBUG_TYPE_KEYS = ['basic', 'fast', 'tank', 'healer', 'slow', 'splitter', 'boss'];
    function spawnDebugMonster(typeKey) {
        if (typeKey === 'boss') {
            spawnBoss();
            return;
        }
        const type = MONSTER_TYPES[typeKey.toUpperCase()];
        if (!type) return;
        const p = G.player; const diff = getDifficultyMultiplier();
        const hp = (type.baseHp + type.hpScale) * diff;
        const speed = (type.baseSpeed + type.speedScale) * Math.min(diff, 3.0);
        const atk = (type.baseAtk + type.atkScale) * Math.min(diff, 4.0);
        const isElite = Math.random() < getEliteChance();
        const angle = rand(0, Math.PI * 2); const d = 80 + rand(0, 60);
        const monster = {
            x: p.x + Math.cos(angle) * d, y: p.y + Math.sin(angle) * d,
            r: isElite ? type.eliteRadius : type.radius,
            hp: Math.min(hp, 5000), maxHp: Math.min(hp, 5000),
            speed: Math.min(speed * (1 - G.buffs.slowAll), 5.0),
            isElite, atk: Math.min(atk, 80),
            hitCooldown: 0, trailDamageCooldown: 0,
            scoreValue: isElite ? type.eliteScoreValue * diff : type.scoreValue * diff,
            type: type.id, typeLabel: type.label, typeEmoji: type.emoji,
            color: isElite ? type.eliteColor : type.color,
            isHealer: type.isHealer || false,
            healAmount: (type.healAmount || 3) * Math.min(diff, 2.5),
            isSlow: type.isSlow || false,
            slowAmount: (type.slowAmount || 0.25) + G.wave * 0.005,
            isSplitter: type.isSplitter || false, splitCount: type.splitCount || 2,
            canSplit: true, healCooldown: 0, isChild: false,
            moveInterval: type.moveInterval || 60,
            moveTimer: rand(0, (type.moveInterval || 60) * 2),
            isMoving: Math.random() < 0.5,
            alwaysMoving: G.wave >= 10 && Math.random() < Math.min(0.10 + 0.09 * (G.wave - 10), 1.0),
        };
        G.monsters.push(monster);
        spawnParticles(monster.x, monster.y, type.color, 8);
        setFeedback(`🐛 调试：生成 ${type.emoji} ${type.label} (HP${Math.floor(monster.hp)})`, '#88ccff');
    }

    // ---------- 分裂逻辑 ----------
    function splitMonster(m) {
        if (!m.canSplit || !m.isSplitter) return;
        const count = Math.min(m.splitCount + Math.floor(G.wave / 10), 4);
        for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2 + rand(-0.3, 0.3);
            const dist2 = 30 + rand(0, 20);
            const child = {
                x: m.x + Math.cos(angle) * dist2,
                y: m.y + Math.sin(angle) * dist2,
                r: m.r * 0.55,
                hp: m.maxHp * 0.3,
                maxHp: m.maxHp * 0.3,
                speed: m.speed * 1.3,
                isElite: false,
                atk: m.atk * 0.4,
                hitCooldown: 0,
                trailDamageCooldown: 0,
                scoreValue: m.scoreValue * 0.2,
                type: 'split_child',
                typeLabel: '子体',
                typeEmoji: '🟢',
                color: '#88cc66',
                isHealer: false,
                healAmount: 0,
                isSlow: false,
                slowAmount: 0,
                isSplitter: false,
                canSplit: false,
                healCooldown: 0,
                isChild: true,
                moveInterval: 40,
                moveTimer: rand(0, 80),
                isMoving: Math.random() < 0.5,
                alwaysMoving: G.wave >= 10 && Math.random() < Math.min(0.10 + 0.09 * (G.wave - 10), 1.0),
            };
            G.monsters.push(child);
            spawnParticles(child.x, child.y, '#88cc66', 4);
        }
    }

    // ---------- BOSS ----------
    function spawnBoss() {
        const type = MONSTER_TYPES.BOSS;
        const hp = getBossHp();
        const w = G.canvasWidth || 780, h = G.canvasHeight || 560;
        const side = randInt(0, 3), pad = 50;
        let x, y;
        if (side === 0) { x = rand(pad, w - pad); y = -pad; }
        else if (side === 1) { x = w + pad; y = rand(pad, h - pad); }
        else if (side === 2) { x = rand(pad, w - pad); y = h + pad; }
        else { x = -pad; y = rand(pad, h - pad); }
        const boss = {
            x, y, r: type.radius,
            hp: Math.min(hp, 800000), maxHp: Math.min(hp, 800000),
            speed: type.baseSpeed * (1 - G.buffs.slowAll),
            isElite: false, atk: type.baseAtk * Math.min(getDifficultyMultiplier(), 4.0),
            hitCooldown: 0, trailDamageCooldown: 0,
            scoreValue: type.scoreValue * getDifficultyMultiplier(),
            type: type.id, typeLabel: type.label, typeEmoji: type.emoji,
            color: type.color, isHealer: false, healAmount: 0,
            isSlow: false, slowAmount: 0, isSplitter: false, canSplit: false,
            healCooldown: 0, isChild: false, isBoss: true,
            spawnTimer: type.spawnInterval,
            moveInterval: type.moveInterval, moveTimer: rand(0, 120),
            isMoving: true, alwaysMoving: true,
        };
        G.monsters.push(boss);
        spawnParticles(x, y, '#ff2266', 35);
        setFeedback(`👑 BOSS登场！HP ${Math.floor(hp)} · 第${G.wave}波`, '#ff3366');
    }

    function spawnBossMinion(boss) {
        const types = ['basic', 'fast', 'slow'];
        const typeId = types[Math.floor(Math.random() * types.length)];
        const type = MONSTER_TYPES[typeId.toUpperCase()] || MONSTER_TYPES.BASIC;
        const diff = getDifficultyMultiplier();
        const angle = rand(0, Math.PI * 2);
        const d = boss.r + 30 + rand(10, 40);
        const m = {
            x: boss.x + Math.cos(angle) * d, y: boss.y + Math.sin(angle) * d,
            r: type.radius * 0.8,
            hp: (type.baseHp + type.hpScale) * diff * 0.5,
            maxHp: (type.baseHp + type.hpScale) * diff * 0.5,
            speed: type.baseSpeed * 1.2 * (1 - G.buffs.slowAll),
            isElite: false, atk: type.baseAtk * 0.5,
            hitCooldown: 0, trailDamageCooldown: 0,
            scoreValue: type.scoreValue * 0.3,
            type: type.id, typeLabel: '爪牙', typeEmoji: type.emoji,
            color: type.color, isHealer: false, healAmount: 0,
            isSlow: false, slowAmount: 0, isSplitter: false, canSplit: false,
            healCooldown: 0, isChild: true, isBoss: false,
            moveInterval: 40, moveTimer: rand(0, 80), isMoving: true,
            alwaysMoving: Math.random() < 0.5,
        };
        G.monsters.push(m);
        spawnParticles(m.x, m.y, '#ff4466', 3);
    }

    // ---------- 治疗逻辑 ----------
    function applyHealing() {
        for (const m of G.monsters) {
            if (!m.isHealer) continue;
            m.healCooldown--;
            if (m.healCooldown <= 0) {
                m.healCooldown = Math.max(40, 60 - G.wave * 0.3);
                for (const other of G.monsters) {
                    if (other === m) continue;
                    if (dist(m, other) < 120) {
                        other.hp = Math.min(other.maxHp, other.hp + m.healAmount);
                        spawnParticles(other.x, other.y, '#44ff88', 1);
                        showFloatingText(other.x, other.y - other.r, '+' + Math.floor(m.healAmount), '#44ff88');
                    }
                }
                m.hp = Math.min(m.maxHp, m.hp + m.healAmount * 0.5);
                spawnParticles(m.x, m.y, '#44ff88', 2);
                showFloatingText(m.x, m.y - m.r, '+' + Math.floor(m.healAmount * 0.5), '#44ff88');
            }
        }
    }
